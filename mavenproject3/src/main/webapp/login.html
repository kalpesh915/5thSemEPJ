<html>
    <head>
        <title>Login Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="text-center p-4 bg-primary text-white">
            <h1>Login Page</h1>
        </div>

        <div class="w-50 mx-auto">
            <form action="loginprocess" method="POST">
                <div class="my-2 form-floating">
                    <input type="email" id="email" name="email" required class="form-control" placeholder="Enter Your Email Address">
                    <label for="email" class="form-label">Enter Your Email Address</label>
                </div>
                <div class="my=2 form-floating ">
                    <input type="password" id="password" name="password" required class="form-control" placeholder="Enter Your Email Password">
                    <label for="password" class="form-label">Enter Your Email Password</label>
                </div>
                <div class="my-2 text-center">
                    <input type="submit" value="Login" class="btn btn-primary">
                    <input type="reset" value="Reset" class="btn btn-danger">
                </div>
            </form>
        </div>
    </body>
</html>
